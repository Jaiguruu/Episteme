name: Bug report
description: Something behaves incorrectly, or differently from what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A reproduction is worth more than a description —
        if you can attach a small repository that triggers it, do.

        **Do not report security issues here.** See
        [SECURITY.md](https://github.com/Jaiguruu/Episteme/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including the full error output if there is one.
      placeholder: |
        `index_repository` raised KeyError: 'symbols' on the second run.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: |
        The corrupt model should be treated as absent and trigger a full rebuild.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of steps that triggers it.
      placeholder: |
        1. pip install -e .
        2. python tools/demo_offline.py tests/fixtures/demo_repo
        3. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The output of `git rev-parse --short HEAD`, or the released version.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python -V`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the pipeline
      description: Pick the closest match; leave it if you are not sure.
      multiple: true
      options:
        - Snapshot / file scanning
        - Change detection / incremental reuse
        - Parsing
        - Extraction / a specific language's .scm query
        - Semantic IR construction
        - Serialization / determinism
        - Documentation
        - Not sure
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues for this problem.
          required: true
        - label: "`python tests/run_all.py` passes on my checkout."
          required: false
        - label: I have read [CONTRIBUTING.md](https://github.com/Jaiguruu/Episteme/blob/main/CONTRIBUTING.md).
          required: false
